name: Film Arşivini Güncelle

on:
  schedule:
    - cron: '0 0 */4 * *'  # Her iki gecede bir 00:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Bu önemli! Push izni için

    steps:
    - name: Kodu klonla
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Node.js kur
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Bağımlılıkları yükle
      run: npm install axios

    - name: Filmleri çek
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: node scrape.js

    - name: Değişiklikleri kontrol et
      id: check_changes
      run: |
        git status --porcelain
        if [ -n "$(git status --porcelain)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Değişiklikleri commit ve push et
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git pull origin main --rebase || true
        git add filmler/*.m3u
        git commit -m "Update movies $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
        git push origin main
